<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F6F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111713" media="(prefers-color-scheme: dark)">
<title>Macro Tracker · Updating</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='10' fill='%2316201B'/%3E%3Crect x='6' y='6' width='10.5' height='10.5' rx='3.5' fill='%234F8DF5'/%3E%3Crect x='19.5' y='6' width='10.5' height='10.5' rx='3.5' fill='%233FB27F'/%3E%3Crect x='6' y='19.5' width='10.5' height='10.5' rx='3.5' fill='%23FFC93C'/%3E%3Crect x='19.5' y='19.5' width='10.5' height='10.5' rx='3.5' fill='%23A07CF2'/%3E%3C/svg%3E">
<style>
  :root{--bg:#F5F6F0;--panel:#fff;--line:#E1E5DB;--text:#16201B;--muted:#55615A}
  @media (prefers-color-scheme: dark){:root{--bg:#111713;--panel:#18201B;--line:#2A352E;--text:#EEF2EC;--muted:#A4AFA7}}
  *{box-sizing:border-box} html,body{margin:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);
       font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  main{max-width:420px;width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:22px;padding:28px 24px}
  svg{display:block;margin-bottom:18px}
  h1{font-size:22px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
  p{margin:0 0 14px;color:var(--muted)} p:last-child{margin:0}
  hr{border:0;border-top:1.5px solid var(--line);margin:20px 0}
</style>
</head>
<body>
<main>
  <svg width="44" height="44" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#16201B"/><rect x="6" y="6" width="10.5" height="10.5" rx="3.5" fill="#4F8DF5"/><rect x="19.5" y="6" width="10.5" height="10.5" rx="3.5" fill="#3FB27F"/><rect x="6" y="19.5" width="10.5" height="10.5" rx="3.5" fill="#FFC93C"/><rect x="19.5" y="19.5" width="10.5" height="10.5" rx="3.5" fill="#A07CF2"/></svg>
  <h1 lang="es">Estamos actualizando Macro Tracker</h1>
  <p lang="es">Vuelve en un rato. Tus datos están guardados y no se pierde nada.</p>
  <hr>
  <h1 lang="en">Macro Tracker is being updated</h1>
  <p lang="en">Check back soon. Your data is saved and nothing is lost.</p>
</main>
</body>
</html>
