<style>
  /* Tokens: light is the base, dark follows the system setting. Shared names with the tracker. */
  :root{
    color-scheme:light dark;
    --bg:#F7E3E6; --panel:rgba(255,255,255,.93); --panel-solid:#FFFFFF; --panel-2:#FBF1EC;
    --line:#EBD9D6; --line-strong:#B59E9F;
    --text:#2A1F24; --muted:#6B5A60; --ink:#2A1F24;
    --accent:#FFC93C; --accent-ink:#2A1F00; --accent-text:#8A5A00;
    --brain:#7A4FD6; --brain-soft:rgba(122,79,214,.14); --streak:#D9480F;
    --good:#1C8A4E; --over:#C93838; --focus:#2F6FD6;
    --rug-btn:rgba(255,255,255,.88); --rug-btn-line:#E9A6B4;
    --veil:rgba(255,255,255,0);
    --radius:22px; --radius-sm:16px;
    --shadow:0 1px 2px rgba(60,30,40,.06),0 10px 28px rgba(60,30,40,.12);
    --font-display:"Bricolage Grotesque","Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#151218; --panel:rgba(30,26,34,.94); --panel-solid:#1E1A22; --panel-2:#28222D;
      --line:#3A3240; --line-strong:#7A6E80;
      --text:#F3EEF2; --muted:#B7ABB6; --ink:#F3EEF2;
      --accent:#FFCF4D; --accent-ink:#2A1F00; --accent-text:#FFCF4D;
      --brain:#B79CFF; --brain-soft:rgba(183,156,255,.16); --streak:#FF8A4C;
      --good:#4ADE80; --over:#F87171; --focus:#7DB8FF;
      --rug-btn:rgba(40,34,45,.9); --rug-btn-line:#E58FA3;
      --veil:rgba(12,10,16,.55);
      --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:20px;line-height:1.45;background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;
  }
  /* Playroom behind every screen; a veil darkens it in dark mode. */
  body::before{content:"";position:fixed;inset:0;z-index:-1;
    background:linear-gradient(var(--veil),var(--veil)),url(img/bg.webp) center bottom/cover no-repeat}
  h1,h2{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;margin:0}
  h1{font-size:30px;line-height:1.1} h2{font-size:22px}
  p{margin:0}
  [hidden]{display:none!important}
  :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 24px;
    border-radius:var(--radius-sm);border:2px solid transparent;font:600 19px/1.2 "Archivo",sans-serif;
    color:var(--text);background:var(--panel-solid);cursor:pointer;text-decoration:none;touch-action:manipulation}
  .btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 rgba(0,0,0,.12)}
  .btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
  .btn.ghost{background:var(--panel-solid);border-color:var(--line)}
  .btn.link{background:transparent;min-height:48px;padding:0 12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
  .btn.small{min-height:48px;padding:0 16px;font-size:17px}
  .btn.wide{width:100%}
  .btn[disabled]{opacity:.6;cursor:default}

  /* Page screens (welcome, sign-in, home, done) */
  .page{max-width:480px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:14px;min-height:100vh}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
  .back{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 14px;border-radius:999px;
    background:var(--panel);color:var(--text);font-weight:600;text-decoration:none;font-size:17px;box-shadow:var(--shadow)}
  .lang{display:inline-flex;background:var(--panel);border-radius:999px;padding:4px;box-shadow:var(--shadow);margin-left:auto}
  .lang button{min-width:52px;min-height:44px;border:0;border-radius:999px;background:transparent;color:var(--muted);
    font:700 16px "Archivo",sans-serif;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--brain);color:#fff}
  .card{background:var(--panel);border-radius:var(--radius);padding:22px 20px;box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .center{text-align:center}
  .stack{display:flex;flex-direction:column;gap:12px}
  .muted{color:var(--muted)}
  .hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:20px;
    background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow)}
  .hero .logo{width:132px;height:132px}
  .hero p{color:var(--muted);max-width:30ch}
  .bars{display:flex;align-items:flex-end;gap:6px;height:96px;border-bottom:2px solid var(--line)}
  .bars .col{flex:1;height:100%;display:flex;align-items:flex-end}
  .bars .bar{width:100%;background:var(--brain);border-radius:6px 6px 0 0;min-height:4px}
  .err{color:var(--over);font-weight:600;min-height:1.45em}
  label{display:block;font-weight:600;margin-bottom:6px}
  input{width:100%;min-height:56px;padding:0 16px;border-radius:var(--radius-sm);border:2px solid var(--line);
    background:var(--panel-solid);color:var(--text);font:500 18px "Archivo",sans-serif}
  input:focus{border-color:var(--brain);outline:none}

  .ringbox{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .ring{position:relative;width:150px;height:150px}
  .ring svg{width:100%;height:100%}
  .ring path{fill:none;stroke-width:12;stroke-linecap:round}
  .ring .off{stroke:var(--brain-soft)} .ring .on{stroke:var(--brain)}
  .ring img{position:absolute;inset:26px;width:98px;height:98px}
  .ringtxt{font-family:var(--font-display);font-size:22px;font-weight:700}
  .streak{color:var(--streak);font-weight:600}
  .mins{color:var(--muted);font-weight:600}
  .gcard{display:grid;grid-template-columns:72px 1fr;gap:10px 14px;align-items:center}
  .gcard img{width:96px;height:96px;object-fit:contain}
  .gcard h2{margin:0}
  .gcard .btn{grid-column:1/-1}
  .lenpick{display:flex;gap:6px}
  .lenpick button{flex:1;min-width:0;min-height:52px;padding:0;white-space:nowrap;border-radius:var(--radius-sm);border:2px solid var(--line);
    background:var(--panel-solid);color:var(--text);font:700 17px "Archivo",sans-serif;cursor:pointer;touch-action:manipulation}
  .lenpick button[aria-pressed="true"]{background:var(--brain);border-color:var(--brain);color:#fff}
  .bar{grid-column:1/-1;height:12px;border-radius:999px;background:var(--brain-soft);overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--brain)}
  .who{color:var(--muted);font-size:17px}
  .best{color:var(--brain);font-weight:700;margin-top:2px}
  .cheer{width:168px;height:168px;margin:0 auto}

  /* Game stage: the playroom image at its own ratio, so the rug box always sits on the rug. */
  .stage-wrap{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:var(--bg)}
  .stage-wrap::before{content:"";position:absolute;inset:-30px;background:linear-gradient(var(--veil),var(--veil)),url(img/bg.webp) center bottom/cover;filter:blur(16px)}
  .stage{position:relative;width:min(100vw,56.28vh);width:min(100vw,56.28dvh);aspect-ratio:941/1672;
    background:linear-gradient(var(--veil),var(--veil)),url(img/bg.webp) center/100% 100% no-repeat;overflow:hidden}
  .ghead{position:absolute;z-index:1;left:50%;transform:translateX(-50%);width:calc(min(100vw,56.28vh) - 20px);width:calc(min(100vw,56.28dvh) - 20px);
    top:max(10px,env(safe-area-inset-top));display:flex;gap:10px;align-items:center;
    background:var(--panel);border-radius:var(--radius-sm);padding:6px;box-shadow:var(--shadow)}
  .gprog{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;padding-right:6px}
  .gname{font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gleft{color:var(--muted);font-size:17px;white-space:nowrap}
  .gprog .bar{height:10px}
  .meter{display:flex;align-items:center;gap:5px;font-size:17px;font-weight:700;color:var(--brain);min-height:18px}
  .meter i{width:13px;height:13px;border-radius:50%;background:var(--brain-soft)}
  .meter i.f{background:var(--brain)}
  .meter b{margin-right:4px}
  .gscore{font-size:17px;font-weight:700;white-space:nowrap}
  .toast{position:absolute;z-index:2;left:50%;top:1%;transform:translateX(-50%);padding:6px 20px;pointer-events:none;border-radius:999px;
    background:var(--accent);color:var(--accent-ink);font:700 21px var(--font-display);box-shadow:var(--shadow);white-space:nowrap}
  .ask{position:absolute;left:3%;right:3%;top:15%;background:var(--panel);border-radius:var(--radius);
    padding:14px 12px 16px;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
  .q{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.2;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  .qimg{width:60px;height:60px}
  .choices{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .cbtn{display:flex;flex-direction:column;align-items:center;gap:4px;width:96px;padding:6px 2px 8px;min-height:48px;
    border-radius:var(--radius-sm);border:2px solid var(--line);background:var(--panel-solid);color:var(--text);
    font:700 19px "Archivo",sans-serif;cursor:pointer;touch-action:manipulation}
  .cbtn img{width:80px;height:80px;object-fit:contain}
  .cbtn:active{border-color:var(--brain)}
  .names{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
  .slots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;min-height:62px}
  .slots span{width:62px;height:62px;border-radius:50%;border:2px dashed var(--line-strong);display:grid;place-items:center;overflow:hidden}
  .slots span.f{border-style:solid;border-color:var(--brain);background:var(--panel-solid)}
  .slots img{width:56px;height:56px;object-fit:contain}

  /* The rug: box over the cloud rug in the image (percent of the stage). */
  .rug{position:absolute;left:1.5%;width:97%;top:67.5%;height:24.2%}
  .it{position:absolute;transform:translate(-50%,-50%);visibility:hidden;pointer-events:none;user-select:none}
  .it.on{visibility:visible}
  .it.center{left:50%;top:50%;width:32%;aspect-ratio:1;object-fit:contain}
  .it.edge{width:17%;aspect-ratio:1;object-fit:contain}
  .walker{left:50%;top:44%;width:44%;aspect-ratio:1;object-fit:contain}
  @media (prefers-reduced-motion: no-preference){
    .walker.go{animation:walk 1s linear both}
    .fb.pop{animation:pop .6s ease-out both}
  }
  @keyframes walk{
    0%{transform:translate(-200%,-50%)} 25%{transform:translate(-125%,-58%)} 50%{transform:translate(-50%,-50%)}
    75%{transform:translate(25%,-58%)} 100%{transform:translate(100%,-50%)}
  }
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(.6);opacity:0} 30%{transform:translate(-50%,-50%) scale(1.05);opacity:1} 100%{transform:translate(-50%,-50%) scale(1)}}
  .pos{position:absolute;transform:translate(-50%,-50%);width:16%;min-width:48px;aspect-ratio:1;border-radius:50%;
    border:3px solid var(--rug-btn-line);background:var(--rug-btn);cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow)}
  .pos:active{background:var(--brain);border-color:var(--brain)}
  .mask{position:absolute;left:2%;top:-6%;width:96%;height:112%;border-radius:50%;image-rendering:pixelated;visibility:hidden}
  .mask.on{visibility:visible}
  .fb{position:absolute;left:50%;top:40%;width:46%;transform:translate(-50%,-50%);pointer-events:none}
  .live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

const sync = BrainApp.sync = Sync.create({

const dayFor = (date) => (state.sessions[date] ? Session.mergeDay(Session.newDay(), state.sessions[date]) : Session.newDay());
function setProgress(p) {
  // Parade.upgrade eases a saved v2 state once: paradeV = 2 marks it done and the next progress save stores both.
  state.progress = { peek: (p && p.peek) || Peek.init(), parade: Parade.upgrade(p && p.parade, p && p.paradeV), paradeV: 2, names: (p && p.names) || {} };
}
// Convert old guest records ("<game>_<len>") to one record per game and store them beside the old keys.
// Run it before sync.uploadGuest, which skips old ids.
function migrateGuestBest() {
  const g = store.get(K.guest);
  if (!g) return {};
  const best = Score.migrateBest(g.best);
  g.best = Object.assign({}, g.best, best); store.set(K.guest, g);
  return best;
}
const namesOn = () => Names.available(CAST_IDS);
// Game length in minutes, stored as a plain string.
function getLen() { try { return Session.clampLen(localStorage.getItem(K.len)); } catch (e) { return 3; } }
function setLen(n) { try { localStorage.setItem(K.len, String(Session.clampLen(n))); } catch (e) {} }
// Queue items; intro marks the day's planned new friends.

}

// Save pipeline. Guests write localStorage at once. Accounts queue dates and progress; one PATCH is in
// flight at a time and always sends the latest merged value. A failure re-queues it and retries with backoff.
let saveTimer = 0, retryTimer = 0, gen = 0, busy = false, backoff = 0, bestTimers = [];
const pending = { days: {}, progress: false };
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 1500); }
// Always save the merge of the loaded day and the current day, so a stale device never lowers progress.
function saveNow() {
  clearTimeout(saveTimer); saveTimer = 0;
  if (state.dirty && state.date && state.day) {
    state.dirty = false;
    const date = state.date, have = state.sessions[date];
    const day = have ? Session.mergeDay(have, state.day) : state.day;
    state.sessions[date] = day;
    if (state.guest) {
      const g = store.get(K.guest) || {};
      g.days = g.days || {}; g.days[date] = day; g.progress = state.progress;
      store.set(K.guest, g);
    } else if (state.key) pending.days[date] = true;
  }
  flush();
}
function saveProgress() {
  if (!state.progress) return;
  if (state.guest) { const g = store.get(K.guest) || {}; g.progress = state.progress; store.set(K.guest, g); }
  else if (state.key) { pending.progress = true; flush(); }
}
async function flush() {
  if (busy || state.guest || !state.key) return;
  const date = Object.keys(pending.days)[0];
  if (!date && !pending.progress) return;
  const my = gen;
  busy = true;
  if (date) delete pending.days[date]; else pending.progress = false;
  try {
    if (date) await sync.saveDay(state.key, date, state.sessions[date]);
    else await sync.saveProgress(state.key, state.progress);
    if (my !== gen) return;   // the account changed while this was in flight
    busy = false; backoff = 0; flush();
  } catch (e) {
    if (my !== gen) return;
    busy = false;
    if (e && e.message === "signed-out") { resetAccount(); return showWelcome(t("errSignedOut")); }
    if (date) pending.days[date] = true; else pending.progress = true;
    backoff = Math.min(60000, backoff ? backoff * 2 : 2000);
    clearTimeout(retryTimer); retryTimer = setTimeout(flush, backoff);
  }
}
// Call on every identity change: drop queued saves and the current day, so nothing crosses accounts.
function resetAccount() {
  gen++; busy = false; backoff = 0;
  clearTimeout(saveTimer); clearTimeout(retryTimer); saveTimer = retryTimer = 0;
  bestTimers.forEach(clearTimeout); bestTimers = [];
  pending.days = {}; pending.progress = false;
  stopGame();
  Object.assign(state, { date: null, day: null, dirty: false, best: {}, stats: {} });
}

/* ---------- Accounts ---------- */
async function enterAccount(upload) {
  showLoading();
  try {
    state.profiles = await sync.profiles();
    const saved = store.get(K.profile), hit = state.profiles.filter((p) => p.key === saved)[0];
    if (hit) return openProfile(hit, upload);
    if (state.profiles.length === 1) return openProfile(state.profiles[0], upload);
    pendingUpload = upload;
    showPicker();
  } catch (e) { showFail(e, () => enterAccount(upload)); }
}
let pendingUpload = false;
async function openProfile(p, upload) {
  resetAccount();
  store.set(K.profile, p.key); sync.pin();   // writes from now on refuse any other signed-in uid
  Object.assign(state, { key: p.key, name: p.name, guest: false, lang: pickLang(p.lang) });
  showLoading();
  try {
    // Guest days go up once, on an explicit sign-in; a failed upload keeps them for next time.
    if (upload) { migrateGuestBest(); try { await sync.uploadGuest(p.key); } catch (e) { if (e.message === "signed-out") throw e; } }
    const d = await sync.load(p.key);
    state.sessions = d.sessions; state.best = Score.migrateBest(d.best); setProgress(d.progress); state.stats = d.stats || {};
    // A pending record (same account and profile, game id) that is higher than the loaded best shows at once.
    const s0 = sync.session(), pm = pendingMap();
    if (s0) Object.keys(pm).forEach((pk) => {
      const pre = s0.uid + "/" + p.key + "/", id = pk.slice(pre.length);
      if (pk.indexOf(pre) === 0 && /^(peek|parade|names)$/.test(id) && Score.isBetter(pm[pk].score, state.best[id])) state.best[id] = pm[pk];
    });
    // A converted record higher than the remote new-id record joins the pending list, so each id is sent once.
    const s = sync.session(), m = pendingMap();
    if (s) Object.keys(state.best).forEach((id) => {
      const pk = s.uid + "/" + p.key + "/" + id, rec = state.best[id];
      if (Score.isBetter(rec.score, d.best[id]) && Score.isBetter(rec.score, m[pk])) m[pk] = rec;
    });
    store.set(K.pendingBest, m);
    sendPendingBest(p.key);
    sendPendingStats(p.key);
    showHome();
  } catch (e) { showFail(e, () => openProfile(p, upload)); }
}
function playGuest() {
  resetAccount();
  const best = migrateGuestBest(), g = store.get(K.guest) || {};
  Object.assign(state, { key: null, name: "", guest: true, sessions: g.days || {}, best, stats: g.stats || {} });
  setProgress(g.progress);
  showHome();
}
function authMsg(e) {
  const m = (e && e.message) || "";
  if (m === "invalid-username") return t("errBadName");
  if (m.indexOf("EMAIL_EXISTS") === 0) return t("errTaken");
  if (/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(m)) return t("errBadLogin");
  if (m.indexOf("WEAK_PASSWORD") === 0) return t("errShortPw");
  if (m.indexOf("TOO_MANY_ATTEMPTS_TRY_LATER") === 0) return t("errTooMany");
  return m === "net" ? t("errNet") : t("errAuth");
}
async function submitAuth(form) {
  const up = form.dataset.v === "up", u = $("u").value.trim(), pw = $("pw").value, err = $("authErr");
  if (!/^[a-z0-9_]{2,20}$/i.test(u)) { err.textContent = t("errBadName"); return; }
  if (pw.length < 6) { err.textContent = t("errShortPw"); return; }

/* ---------- Game loop: one rAF loop per game screen counts foreground time and drives timed displays ---------- */
// playMs/lenMs: this game's own active time and length; run: Name that friend choice count and streaks;
// streak: Name that friend correct answers in a row that can earn an extra new friend.
const game = { mode: null, raf: 0, last: 0, frameMs: 1000 / 60, onFrame: null, shownS: -1, queue: null, met: null, active: 0,
  playMs: 0, lenMs: 0, run: null, score: 0, streak: 0 };
const IDLE_MS = 20000, WAITS = /^(ask|ask2|meet)$/;   // a screen that waits for the player pauses the clock after 20 s idle
let cur = null, fbTimer = 0, toastTimer = 0;
function loopStart() { if (!game.raf && game.mode) { game.last = 0; game.active = performance.now(); game.raf = requestAnimationFrame(tick); } }
function loopStop() { cancelAnimationFrame(game.raf); game.raf = 0; }
function tick(ts) {
  if (today() !== state.date) return goHome();   // a new day: save the old one, never add play to it
  game.raf = requestAnimationFrame(tick);
  if (!cur || !WAITS.test(cur.phase)) game.active = ts;   // timed displays and feedback count as play
  if (game.last) {
    const d = ts - game.last;
    if (d > 4 && d < 100) game.frameMs = game.frameMs * 0.9 + d * 0.1;   // measured frame interval
    if (ts - game.active < IDLE_MS) {
      const was = state.day.completedAt;
      state.day = Session.addTime(state.day, game.mode, d, Date.now()); state.dirty = true;
      if (d > 0 && d <= Session.MAX_DELTA_MS) game.playMs += d;   // same rule as addTime
      if (was == null && state.day.completedAt != null) showToast(t("todayCounts"));
    }
  }
  game.last = ts;
  if (game.onFrame) game.onFrame(ts);
  updateClock();
}
// Keep what was painted at frame time t0 until ms have passed (to the nearest frame), then run fn(ts).
// Timestamps, not frame counts, so a 120 Hz screen shows the same time as a 60 Hz one.
function hold(t0, ms, fn) {
  game.onFrame = (ts) => { if (ts - t0 >= ms - game.frameMs / 2) { game.onFrame = null; fn(ts); } };
}
function stopGame() {
  loopStop(); clearTimeout(fbTimer); clearTimeout(toastTimer);
  game.mode = null; game.onFrame = null; cur = null;
}
document.addEventListener("visibilitychange", () => {
  if (!game.mode) return;
  if (document.visibilityState === "hidden") {
    loopStop();
    // A timed display seen only in part is not fair: drop it and start a new round on return.
    if (cur && /setup|show|mask|walk/.test(cur.phase)) { game.onFrame = null; cur = null; clearStage(); }
    saveNow(); saveProgress();
  } else {
    if (today() !== state.date) return goHome();
    loopStart();
    if (!cur) nextRound();
  }
});
["pointerdown", "keydown"].forEach((ev) => addEventListener(ev, () => { game.active = performance.now(); }, true));
addEventListener("pagehide", () => { if (game.mode) { saveNow(); saveProgress(); } else saveNow(); });

function updateClock() {
  if (!game.mode) return;
  const sec = Math.floor(game.playMs / 1000);
  if (sec === game.shownS) return;
  game.shownS = sec;
  const bar = $("gbar"), left = $("gleft");
  if (bar) bar.style.width = Math.min(100, 100 * game.playMs / game.lenMs).toFixed(1) + "%";
  if (left) left.textContent = t("minLeft", { m: Math.max(0, Math.ceil((game.lenMs - game.playMs) / 60000)) });
}
// Difficulty meter: Peek level and speed step, Parade sequence length, Names choice count.
function updateMeter() {
  const el = $("meter");
  if (!el) return;
  const dots = (n, on) => Array.apply(null, Array(n)).map((x, i) => `<i class="${i < on ? "f" : ""}"></i>`).join("");
  const p = state.progress;
  if (game.mode === "peek") el.innerHTML = `<b>${esc(t("level", { n: p.peek.level }))}</b>${dots(5, Peek.speedStep(p.peek.ms))}`;
  else if (game.mode === "parade") el.innerHTML = dots(p.parade.span, p.parade.span);
  else el.innerHTML = `<b>${esc(t("choicesN", { n: game.run.choices }))}</b>`;
}
function updateScore() { const el = $("gscore"); if (el) el.textContent = t("points", { n: game.score }); }
function showToast(msg) {
  const el = $("toast");
  if (!el) return;
  el.textContent = msg; el.hidden = false; $("live").textContent = msg;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2000);
}
function stageHTML(mode) {

    <div class="stage"><div class="ask" id="ask" hidden></div><div class="toast" id="toast" hidden></div>

function startGame(mode) {
  if (!GAMES[mode] || (mode === "names" && !namesOn())) return;
  state.date = today(); state.day = dayFor(state.date);
  Object.assign(game, { mode, shownS: -1, playMs: 0, lenMs: getLen() * 60000, met: {}, queue: [], run: null, score: 0, streak: 0 });
  cur = null;
  if (mode === "names") game.run = Names.startRun(state.progress.names);
  render(stageHTML(mode));
  updateClock(); updateMeter(); updateScore(); loopStart(); nextRound();
}
// The round in progress always finishes; the game ends at the next round once its time is up.
function nextRound() { if (game.playMs >= game.lenMs) endGame(); else ROUND[game.mode](); }
function endGame() {
  const mode = game.mode, ms = game.playMs, score = game.score, len = Math.round(game.lenMs / 60000);
  const rating = Score.rating(score, len), newBest = recordBest(mode, len, score, rating);
  recordStats(mode, rating);
  saveNow(); saveProgress(); showCheer(mode, ms, score, rating, newBest);
}
// Add the finished game to the stats of the game day (state.date, the day of the minutes; equal to today() here).
function recordStats(mode, rating) {
  const date = state.date;
  if (!date) return;
  state.stats = Stats.add(state.stats, date, mode, rating);
  if (state.guest) { const g = store.get(K.guest) || {}; g.stats = state.stats; store.set(K.guest, g); }
  else if (state.key) sendStats(state.key, date, mode, 0);
}
// A failed stats write keeps the full {n, sum, best} entry in localStorage and retries after 2 s, 8 s and 30 s.
// The write always sends the newest entry (higher n), so a game is never lost or counted twice.
const newer = (a, b) => (a && (!b || a.n > b.n) ? a : b);
const pendingStatsMap = () => { const m = store.get(K.pendingStats); return m && typeof m === "object" ? m : {}; };
function sendStats(key, date, game, attempt) {
  const s = sync.session(), uid = s && s.uid;
  if (!uid) return;
  const pk = uid + "/" + key + "/" + date + "/" + game, my = gen;
  const e = newer(state.stats[date] && state.stats[date][game], pendingStatsMap()[pk]);
  if (!e) return;
  const sent = { n: e.n, sum: e.sum, best: e.best };
  sync.saveStats(key, date, game, sent).then(() => {
    const m = pendingStatsMap();
    if (m[pk] && m[pk].n <= sent.n) { delete m[pk]; store.set(K.pendingStats, m); }
  }, (err) => {
    const m = pendingStatsMap(), msg = err && err.message;
    if (msg === "signed-out" || msg === "bad-path") { delete m[pk]; store.set(K.pendingStats, m); return; }
    const cur = my === gen && state.stats[date] && state.stats[date][game];
    m[pk] = newer(cur, newer(m[pk], sent));
    store.set(K.pendingStats, m);
    if (my !== gen || attempt >= BEST_RETRY.length) return;
    bestTimers.push(setTimeout(() => { if (my === gen) sendStats(key, date, game, attempt + 1); }, BEST_RETRY[attempt]));
  });
}
// Call right after a load. A pending entry of this account and profile with more games than the loaded one
// goes into state.stats and is sent; any other pending entry is dropped.
function sendPendingStats(key) {
  const s = sync.session(), uid = s && s.uid;
  if (!uid) return;
  const prefix = uid + "/" + key + "/", m = pendingStatsMap(), send = [];
  Object.keys(m).forEach((pk) => {
    if (pk.indexOf(prefix) !== 0) return;
    const r = /^(\d{4}-\d{2}-\d{2})\/(peek|parade|names)$/.exec(pk.slice(prefix.length)), e = m[pk];
    const have = r && state.stats[r[1]] && state.stats[r[1]][r[2]];
    if (!r || !e || !(e.n > 0) || (have && have.n >= e.n)) { delete m[pk]; return; }
    state.stats[r[1]] = Object.assign({}, state.stats[r[1]], { [r[2]]: e });
    send.push([r[1], r[2]]);
  });
  store.set(K.pendingStats, m);
  send.forEach((x) => sendStats(key, x[0], x[1], 0));
}
// Keep a higher rating as the record for this game; true when it beat the old record.
// Accounts save in the background: an error keeps the local record and never blocks the cheer screen.
function recordBest(mode, len, points, rating) {
  const id = Score.bestId(mode);
  if (!(rating > 0) || !Score.isBetter(rating, state.best[id])) return false;
  const rec = { score: rating, points, len, at: Date.now() };
  state.best[id] = rec;
  if (state.guest) { const g = store.get(K.guest) || {}; g.best = g.best || {}; g.best[id] = rec; store.set(K.guest, g); }
  else if (state.key) {
    sendBest(state.key, id, rec, 0);
  }
  return true;
}
// A failed account record stays in localStorage (higher score per entry) and is retried after 2 s, 8 s and 30 s.
// An entry leaves the list once a call resolves. Another account never sends it.
const BEST_RETRY = [2000, 8000, 30000];
function pendingMap() { const m = store.get(K.pendingBest); return m && typeof m === "object" ? m : {}; }
function sendBest(key, id, rec, attempt) {
  const s = sync.session(), uid = s && s.uid;
  if (!uid) return;
  const pk = uid + "/" + key + "/" + id, my = gen, best = state.best;
  sync.saveBest(key, id, rec).then((r) => {
    const m = pendingMap();
    if (m[pk] && m[pk].score <= rec.score) { delete m[pk]; store.set(K.pendingBest, m); }
    // Never lower the local record: keep the higher of it and the returned one.
    if (my === gen && best === state.best && r && r.best && Score.isBetter(r.best.score, best[id])) best[id] = r.best;
  }, (e) => {
    const msg = e && e.message;
    if (msg === "signed-out" || msg === "bad-path") return;
    const m = pendingMap();
    if (!m[pk] || rec.score > m[pk].score) m[pk] = { score: rec.score, points: rec.points, len: rec.len, at: rec.at };
    store.set(K.pendingBest, m);
    if (my !== gen || attempt >= BEST_RETRY.length) return;
    bestTimers.push(setTimeout(() => { if (my === gen) sendBest(key, id, pendingMap()[pk] || m[pk], attempt + 1); }, BEST_RETRY[attempt]));
  });
}
// Send the saved records of this account and profile; call it right after a load.
function sendPendingBest(key) {
  const s = sync.session(), uid = s && s.uid;
  if (!uid) return;
  const prefix = uid + "/" + key + "/", m = pendingMap();
  // An entry queued under an old id ("<game>_<len>") moves to the game id as a rating; nothing is dropped.
  Object.keys(m).forEach((pk) => {
    const old = pk.indexOf(prefix) === 0 && /^(peek|parade|names)_([1-5])$/.exec(pk.slice(prefix.length));
    if (!old) return;
    const len = +old[2], to = prefix + old[1], rec = { score: Score.rating(m[pk].score, len), points: m[pk].score, len, at: m[pk].at };
    if (!m[to] || rec.score > m[to].score) m[to] = rec;
    delete m[pk];
  });
  store.set(K.pendingBest, m);
  Object.keys(m).forEach((pk) => { if (pk.indexOf(prefix) === 0) sendBest(key, pk.slice(prefix.length), m[pk], 0); });
}
function goHome() { if (game.mode) { saveNow(); saveProgress(); } showHome(); }
function showAsk(html) { const a = $("ask"); a.innerHTML = html; a.hidden = false; }
function hideAsk() { $("ask").hidden = true; }
function clearStage() {
  document.querySelectorAll(".it.on,.mask.on").forEach((el) => el.classList.remove("on", "go"));
  document.querySelectorAll(".pos").forEach((b) => { b.hidden = true; });
  hideAsk();
}
const decoded = (imgs) => Promise.all(imgs.map((i) => (i.decode ? i.decode().catch(() => {}) : 0)));
const charBtn = (id) => { const m = member(id); return `<button class="cbtn" data-act="pick" data-id="${m.id}" aria-label="${esc(m.name)}"><img src="${m.img}" alt=""><span>${esc(m.name)}</span></button>`; };
function feedback(ok, pts) {
  cur.phase = "fb"; hideAsk(); saveSoon();
  game.score += ok ? pts : 0; updateScore();
  const fb = $("fb");
  fb.src = ok ? Cast.ART.cheer : Cast.ART.oops; fb.hidden = false;
  fb.classList.remove("pop"); void fb.offsetWidth; fb.classList.add("pop");
  $("live").textContent = t(ok ? "right" : "wrong");
  updateMeter();
  fbTimer = setTimeout(() => { fb.hidden = true; nextRound(); }, 600);
}

/* Peek-a-boo: show for ms, mask 250 ms, then ask. */
function drawMask() {
  const c = $("mask"), x = c.getContext("2d"), img = x.createImageData(c.width, c.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = 120 + Math.random() * 135;
    d[i] = v + Math.random() * 40; d[i + 1] = v * (0.75 + Math.random() * 0.25); d[i + 2] = v + Math.random() * 30; d[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
}
function peekRound() {
  const st = state.progress.peek, tr = Peek.makeTrial(st, Math.random, CAST_IDS, Cast.GROUPS), target = pick(Cast.TARGETS);
  const me = cur = { tr, target, ans: {}, phase: "setup", level: st.level, step: Peek.speedStep(st.ms), t0: 0 };
  clearStage();
  const pc = $("pc"), shown = [pc];
  pc.src = member(tr.center).img;
  POS.forEach((q, p) => {
    const s = $("s" + p);
    if (p === tr.edge) s.src = target.img;
    else if (tr.distractors.indexOf(p) >= 0) s.src = pick(Cast.DISTRACTORS).img;
    else return;
    shown.push(s);
  });
  decoded(shown).then(() => {
    if (cur !== me) return;
    game.onFrame = (t0) => {
      game.onFrame = null; me.phase = "show";
      shown.forEach((el) => el.classList.add("on"));
      hold(t0, st.ms, (t1) => {
        shown.forEach((el) => el.classList.remove("on"));
        drawMask(); $("mask").classList.add("on"); me.phase = "mask";
        hold(t1, 250, () => { $("mask").classList.remove("on"); me.phase = "ask"; askCenter(); });
      });
    };
  });
}
function askCenter() {
  cur.t0 = performance.now();   // answer time runs from the first question to the final answer tap
  showAsk(`<p class="q">${esc(t("peekQ1"))}</p><div class="choices">${cur.tr.choices.map(charBtn).join("")}</div>`);
}
function askEdge() {
  cur.phase = "ask2";
  showAsk(`<p class="q"><span>${esc(t("peekQ2", { thing: t("thing_" + cur.target.id) }))}</span><img class="qimg" src="${cur.target.img}" alt=""></p>`);
  document.querySelectorAll(".pos").forEach((b) => { b.hidden = false; });
}
function peekAnswer(key, v) {
  if (key === "center" && cur.phase !== "ask") return;
  if (key === "edge" && cur.phase !== "ask2") return;
  cur.ans[key] = v;
  if (key === "center" && state.progress.peek.level >= 2) return askEdge();
  document.querySelectorAll(".pos").forEach((b) => { b.hidden = true; });
  const answerMs = performance.now() - cur.t0;
  const r = Peek.grade(state.progress.peek, cur.tr, cur.ans);
  state.progress.peek = r.state;
  feedback(r.ok, Score.peek({ ok: r.ok, answerMs, level: cur.level, step: cur.step }));
}

/* Toy parade: a pool of span + 1 random friends (up to 6); each walks across for the state's ms, then the player taps them in order. */
function paradeRound() {
  const st = state.progress.parade, ms = st.ms;
  const pool = Parade._shuffle(CAST_IDS, Math.random).slice(0, Parade.gridSize(st.span));
  const r = Parade.makeSequence(st, Math.random, pool);
  const me = cur = { r, pool, ans: [], phase: "setup" };
  clearStage();
  const w = $("walker");
  let i = 0;
  const step = (ts) => {
    if (i >= r.seq.length) { w.classList.remove("on", "go"); me.phase = "ask"; askParade(); return; }
    w.src = member(r.seq[i]).img; w.alt = member(r.seq[i]).name;
    w.style.animationDuration = ms + "ms";
    w.classList.remove("go"); void w.offsetWidth; w.classList.add("on", "go");
    i++;
    hold(ts, ms, step);
  };
  const imgs = pool.map((id) => { const x = new Image(); x.src = member(id).img; return x; });
  decoded(imgs).then(() => {
    if (cur !== me) return;
    game.onFrame = (ts) => { game.onFrame = null; me.phase = "walk"; step(ts); };
  });
}
function askParade() {
  showAsk(`<p class="q">${esc(t(cur.r.reverse ? "paradeQRev" : "paradeQ"))}</p><div class="slots" id="slots"></div>
    <div class="choices">${cur.pool.map(charBtn).join("")}</div>
    <button class="btn small link" data-act="undo">${esc(t("undo"))}</button>`);
  renderSlots();
}
function renderSlots() {
  $("slots").innerHTML = cur.r.seq.map((x, i) => {
    const id = cur.ans[i];
    return id ? `<span class="f"><img src="${member(id).img}" alt="${esc(member(id).name)}"></span>` : `<span></span>`;
  }).join("");
}
function paradeTap(id) {
  if (cur.phase !== "ask") return;
  cur.ans.push(id); renderSlots();
  if (cur.ans.length < cur.r.seq.length) return;
  const g = Parade.grade(state.progress.parade, cur.r, cur.ans);
  state.progress.parade = g.state;
  feedback(g.ok, Score.parade({ ok: g.ok, span: cur.r.seq.length, reverse: cur.r.reverse }));
}

/* Name that friend: Leitner cards; a wrong card comes back later in the game.
   With no card due and no intro left, practice rounds show the cards due soonest and do not grade. */
function namesRound() {
  if (!game.queue.length) {
    const q = namesQueue(state.date);
    game.queue = q.length ? q : Names.practice(state.progress.names, CAST_IDS, 5).map((id) => ({ id, practice: true }));
  }
  const next = game.queue.shift();
  if (!next) return endGame();
  const id = next.id;
  cur = { id, practice: !!next.practice, intro: !!next.intro, phase: "ask" };
  clearStage();
  const pc = $("pc"); pc.src = member(id).img; pc.classList.add("on");
  const isNew = !Object.prototype.hasOwnProperty.call(state.progress.names, id);
  if (isNew && !game.met[id]) {
    game.met[id] = true; cur.phase = "meet";
    return showAsk(`<p class="q">${esc(t("meet", { name: member(id).name }))}</p><button class="btn primary" data-act="met">${esc(t("gotIt"))}</button>`);
  }
  askName();
}
function askName() {
  cur.phase = "ask";
  showAsk(`<p class="q">${esc(t("namesQ"))}</p><div class="names">${Names.choices(cur.id, CAST_IDS, Math.random, game.run.choices)
    .map((x) => `<button class="btn ghost" data-act="name" data-id="${x}">${esc(member(x).name)}</button>`).join("")}</div>`);
}
function nameAnswer(id) {
  if (cur.phase !== "ask") return;
  const ok = id === cur.id, n = game.run.choices;
  if (!cur.practice) {
    state.progress.names = Names.grade(state.progress.names, cur.id, ok, state.date);
    if (!ok) game.queue.push({ id: cur.id });
  }
  // Planned intros do not count; after 3 right in a row, and once those intros are graded, one more new friend.
  if (!ok) game.streak = 0; else if (!cur.intro) game.streak++;
  if (game.streak >= 3 && !game.queue.some((q) => q.intro)) {
    game.streak = 0;
    const extra = Names.extraIntro(state.progress.names, CAST_IDS, state.date);
    if (extra) game.queue.unshift({ id: extra });
  }
  game.run = Names.adapt(game.run, ok);
  if (game.run.choices !== n) state.progress.names = Names.saveChoices(state.progress.names, game.run.choices);

const ROUND = { peek: peekRound, parade: paradeRound, names: namesRound };

/* ---------- Events ---------- */
app.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const v = b.dataset.v;
  switch (b.dataset.act) {
    case "lang": state.lang = v; store.set(K.lang, v); if (redraw) redraw(); break;
    case "tracker": sync.useTrackerSession(); store.set(K.profile, null); enterAccount(true); break;
    case "auth": showAuth(v); break;
    case "welcome": showWelcome(); break;
    case "guest": playGuest(); break;
    case "profile": openProfile(state.profiles[+b.dataset.i], pendingUpload); break;
    case "signout": saveNow(); saveProgress(); resetAccount(); sync.signOut(); Object.assign(state, { key: null, name: "", guest: false, sessions: {}, progress: null }); showWelcome(); break;
    case "retry": if (failRetry) failRetry(); break;
    case "play": startGame(v); break;
    case "len": setLen(v); document.querySelectorAll("[data-act=len]").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); break;
    case "home": goHome(); break;
    case "progress": showProgress(); break;
    case "pick": if (game.mode === "peek") peekAnswer("center", b.dataset.id); else if (game.mode === "parade") paradeTap(b.dataset.id); break;
    case "pos": peekAnswer("edge", +b.dataset.p); break;
    case "undo": if (cur && cur.phase === "ask" && cur.ans.length) { cur.ans.pop(); renderSlots(); } break;
    case "met": askName(); break;
    case "name": nameAnswer(b.dataset.id); break;
  }
});
app.addEventListener("submit", (e) => { e.preventDefault(); if (e.target.id === "authForm") submitAuth(e.target); });

if (sync.session()) enterAccount(false); else showWelcome();
</script>
