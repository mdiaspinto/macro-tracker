<style>
  /* Tokens: light is the base, dark follows the system setting. Shared names with the tracker. */
  :root{
    color-scheme:light dark;
    --bg:#F7E3E6; --panel:rgba(255,255,255,.93); --panel-solid:#FFFFFF; --panel-2:#FBF1EC;
    --line:#EBD9D6; --line-strong:#B59E9F;
    --text:#2A1F24; --muted:#6B5A60; --ink:#2A1F24;
    --accent:#FFC93C; --accent-ink:#2A1F00; --accent-text:#8A5A00;
    --brain:#7A4FD6; --brain-soft:rgba(122,79,214,.14); --streak:#D9480F;
    --good:#1C8A4E; --over:#C93838; --focus:#2F6FD6;
    --rug-btn:rgba(255,255,255,.88); --rug-btn-line:#E9A6B4;
    --veil:rgba(255,255,255,0);
    --radius:22px; --radius-sm:16px;
    --shadow:0 1px 2px rgba(60,30,40,.06),0 10px 28px rgba(60,30,40,.12);
    --font-display:"Bricolage Grotesque","Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#151218; --panel:rgba(30,26,34,.94); --panel-solid:#1E1A22; --panel-2:#28222D;
      --line:#3A3240; --line-strong:#7A6E80;
      --text:#F3EEF2; --muted:#B7ABB6; --ink:#F3EEF2;
      --accent:#FFCF4D; --accent-ink:#2A1F00; --accent-text:#FFCF4D;
      --brain:#B79CFF; --brain-soft:rgba(183,156,255,.16); --streak:#FF8A4C;
      --good:#4ADE80; --over:#F87171; --focus:#7DB8FF;
      --rug-btn:rgba(40,34,45,.9); --rug-btn-line:#E58FA3;
      --veil:rgba(12,10,16,.55);
      --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:18px;line-height:1.45;background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;
  }
  /* Playroom behind every screen; a veil darkens it in dark mode. */
  body::before{content:"";position:fixed;inset:0;z-index:-1;
    background:linear-gradient(var(--veil),var(--veil)),url(img/bg.webp) center bottom/cover no-repeat}
  h1,h2{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;margin:0}
  h1{font-size:30px;line-height:1.1} h2{font-size:22px}
  p{margin:0}
  [hidden]{display:none!important}
  :focus-visible{outline:3px solid var(--focus);outline-offset:3px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 24px;
    border-radius:var(--radius-sm);border:2px solid transparent;font:600 19px/1.2 "Archivo",sans-serif;
    color:var(--text);background:var(--panel-solid);cursor:pointer;text-decoration:none;touch-action:manipulation}
  .btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 rgba(0,0,0,.12)}
  .btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
  .btn.ghost{background:var(--panel-solid);border-color:var(--line)}
  .btn.link{background:transparent;min-height:48px;padding:0 12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
  .btn.small{min-height:48px;padding:0 16px;font-size:17px}
  .btn.wide{width:100%}
  .btn[disabled]{opacity:.6;cursor:default}

  /* Page screens (welcome, sign-in, home, done) */
  .page{max-width:480px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:14px;min-height:100vh}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
  .back{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 14px;border-radius:999px;
    background:var(--panel);color:var(--text);font-weight:600;text-decoration:none;font-size:17px;box-shadow:var(--shadow)}
  .lang{display:inline-flex;background:var(--panel);border-radius:999px;padding:4px;box-shadow:var(--shadow);margin-left:auto}
  .lang button{min-width:52px;min-height:44px;border:0;border-radius:999px;background:transparent;color:var(--muted);
    font:700 16px "Archivo",sans-serif;cursor:pointer}
  .lang button[aria-pressed="true"]{background:var(--brain);color:#fff}
  .card{background:var(--panel);border-radius:var(--radius);padding:22px 20px;box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  .center{text-align:center}
  .stack{display:flex;flex-direction:column;gap:12px}
  .muted{color:var(--muted)}
  .hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:20px;
    background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow)}
  .hero .logo{width:132px;height:132px}
  .hero p{color:var(--muted);max-width:30ch}
  .err{color:var(--over);font-weight:600;min-height:1.45em}
  label{display:block;font-weight:600;margin-bottom:6px}
  input{width:100%;min-height:56px;padding:0 16px;border-radius:var(--radius-sm);border:2px solid var(--line);
    background:var(--panel-solid);color:var(--text);font:500 18px "Archivo",sans-serif}
  input:focus{border-color:var(--brain);outline:none}

  .ringbox{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .ring{position:relative;width:150px;height:150px}
  .ring svg{width:100%;height:100%}
  .ring path{fill:none;stroke-width:12;stroke-linecap:round}
  .ring .off{stroke:var(--brain-soft)} .ring .on{stroke:var(--brain)}
  .ring img{position:absolute;inset:26px;width:98px;height:98px}
  .ringtxt{font-family:var(--font-display);font-size:22px;font-weight:700}
  .streak{color:var(--streak);font-weight:600}
  .parts{display:flex;flex-direction:column;gap:14px;margin-top:6px}
  .part{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
  .part b{font-size:19px}
  .part .t{color:var(--muted);font-size:17px}
  .bar{grid-column:1/-1;height:12px;border-radius:999px;background:var(--brain-soft);overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--brain)}
  .ok{color:var(--good);font-weight:700;display:inline-flex;align-items:center;gap:4px}
  .ok svg{width:20px;height:20px}
  .who{color:var(--muted);font-size:17px}
  .cheer{width:168px;height:168px;margin:0 auto}

  /* Game stage: the playroom image at its own ratio, so the rug box always sits on the rug. */
  .stage-wrap{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:var(--bg)}
  .stage-wrap::before{content:"";position:absolute;inset:-30px;background:linear-gradient(var(--veil),var(--veil)),url(img/bg.webp) center bottom/cover;filter:blur(16px)}
  .stage{position:relative;width:min(100vw,56.28vh);width:min(100vw,56.28dvh);aspect-ratio:941/1672;
    background:linear-gradient(var(--veil),var(--veil)),url(img/bg.webp) center/100% 100% no-repeat;overflow:hidden}
  .ghead{position:absolute;z-index:1;left:50%;transform:translateX(-50%);width:calc(min(100vw,56.28vh) - 20px);width:calc(min(100vw,56.28dvh) - 20px);
    top:max(10px,env(safe-area-inset-top));display:flex;gap:10px;align-items:center;
    background:var(--panel);border-radius:var(--radius-sm);padding:6px;box-shadow:var(--shadow)}
  .gprog{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;padding-right:6px}
  .gname{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gleft{color:var(--muted);font-size:15px;white-space:nowrap}
  .gprog .bar{height:10px}
  .ask{position:absolute;left:3%;right:3%;top:15%;background:var(--panel);border-radius:var(--radius);
    padding:14px 12px 16px;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
  .q{font-family:var(--font-display);font-size:23px;font-weight:700;line-height:1.2;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  .qimg{width:44px;height:44px}
  .choices{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
  .cbtn{display:flex;flex-direction:column;align-items:center;gap:2px;width:74px;padding:6px 2px 8px;min-height:48px;
    border-radius:var(--radius-sm);border:2px solid var(--line);background:var(--panel-solid);color:var(--text);
    font:700 17px "Archivo",sans-serif;cursor:pointer;touch-action:manipulation}
  .cbtn img{width:60px;height:60px}
  .cbtn:active{border-color:var(--brain)}
  .names{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
  .slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:46px}
  .slots span{width:46px;height:46px;border-radius:50%;border:2px dashed var(--line-strong);display:grid;place-items:center;overflow:hidden}
  .slots span.f{border-style:solid;border-color:var(--brain);background:var(--panel-solid)}
  .slots img{width:40px;height:40px}

  /* The rug: box over the cloud rug in the image (percent of the stage). */
  .rug{position:absolute;left:1.5%;width:97%;top:67.5%;height:24.2%}
  .it{position:absolute;transform:translate(-50%,-50%);visibility:hidden;pointer-events:none;user-select:none}
  .it.on{visibility:visible}
  .it.center{left:50%;top:50%;width:23%}
  .it.edge{width:14%}
  .walker{left:50%;top:44%;width:30%}
  @media (prefers-reduced-motion: no-preference){
    .walker.go{animation:walk 1s linear both}
    .fb.pop{animation:pop .6s ease-out both}
  }
  @keyframes walk{
    0%{transform:translate(-200%,-50%)} 25%{transform:translate(-125%,-58%)} 50%{transform:translate(-50%,-50%)}
    75%{transform:translate(25%,-58%)} 100%{transform:translate(100%,-50%)}
  }
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(.6);opacity:0} 30%{transform:translate(-50%,-50%) scale(1.05);opacity:1} 100%{transform:translate(-50%,-50%) scale(1)}}
  .pos{position:absolute;transform:translate(-50%,-50%);width:16%;min-width:48px;aspect-ratio:1;border-radius:50%;
    border:3px solid var(--rug-btn-line);background:var(--rug-btn);cursor:pointer;touch-action:manipulation;box-shadow:var(--shadow)}
  .pos:active{background:var(--brain);border-color:var(--brain)}
  .mask{position:absolute;left:2%;top:-6%;width:96%;height:112%;border-radius:50%;image-rendering:pixelated;visibility:hidden}
  .mask.on{visibility:visible}
  .fb{position:absolute;left:50%;top:40%;width:36%;transform:translate(-50%,-50%);pointer-events:none}
  .live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

const FIREBASE = {
  databaseURL: "https://macro-tracker-d8908-default-rtdb.firebaseio.com",
  apiKey: "AIzaSyB55M91PmvJia0hN2WbICCn_vTtKLZu4pQ",
  emailDomain: "macro-tracker-d8908.firebaseapp.com",
};
const K = { profile: "brainGames.profile", guest: "brainGames.guest", lang: "brainGames.lang" };
const CAST_IDS = Cast.MEMBERS.map((m) => m.id);
const PARTS = { peek: ["partPeek", Session.PEEK_GOAL_S], parade: ["partParade", Session.PARADE_S], names: ["partNames", Session.NAMES_MAX_S] };
// 8 edge positions on an ellipse inside the rug box, clockwise from the top (percent of the rug box).
const POS = [0, 1, 2, 3, 4, 5, 6, 7].map((p) => ({ x: 50 + 41 * Math.sin(p * Math.PI / 4), y: 50 - 44 * Math.cos(p * Math.PI / 4) }));

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
const BrainApp = window.BrainApp = { fetchImpl: window.fetch.bind(window) };
const sync = BrainApp.sync = Sync.create({
  fetch: (...a) => BrainApp.fetchImpl(...a), storage: localStorage, now: () => Date.now(), firebase: FIREBASE,
});
const state = BrainApp.state = {
  lang: "en", key: null, name: "", guest: false, profiles: [],
  sessions: {}, progress: null, date: null, day: null, dirty: false,
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const t = (k, v) => String(T[state.lang][k] || T.en[k] || k).replace(/\{(\w+)\}/g, (m, x) => (v && v[x] != null ? v[x] : m));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const member = (id) => Cast.MEMBERS.filter((m) => m.id === id)[0];
const pad = (n) => (n < 10 ? "0" : "") + n;
const today = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
function pickLang(profileLang) {
  const s = store.get(K.lang);
  if (s === "en" || s === "es") return s;
  if (profileLang === "en" || profileLang === "es") return profileLang;
  return /^es/i.test(navigator.language || "") ? "es" : "en";
}
state.lang = pickLang(null);

// Preload all art once so a timed display never waits on the network.
Cast.MEMBERS.concat(Cast.TARGETS, Cast.DISTRACTORS).map((x) => x.img).concat([Cast.ART.cheer, Cast.ART.oops])
  .forEach((src) => { const i = new Image(); i.src = src; });

/* ---------- Data ---------- */
const dayFor = (date) => (state.sessions[date] ? Session.mergeDay(Session.newDay(), state.sessions[date]) : Session.newDay());
function setProgress(p) {
  state.progress = { peek: (p && p.peek) || Peek.init(), parade: (p && p.parade) || Parade.init(), names: (p && p.names) || {} };
}
const namesOn = () => Names.available(CAST_IDS);
function namesQueue(date) { const p = Names.plan(state.progress.names, CAST_IDS, date); return p.review.concat(p.intro); }

// Save pipeline. Guests write localStorage at once. Accounts queue dates and progress; one PATCH is in
// flight at a time and always sends the latest merged value. A failure re-queues it and retries with backoff.
let saveTimer = 0, retryTimer = 0, gen = 0, busy = false, backoff = 0;
const pending = { days: {}, progress: false };
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 1500); }
// Always save the merge of the loaded day and the current day, so a stale device never lowers progress.
function saveNow() {
  clearTimeout(saveTimer); saveTimer = 0;
  if (state.dirty && state.date && state.day) {
    state.dirty = false;
    const date = state.date, have = state.sessions[date];
    const day = have ? Session.mergeDay(have, state.day) : state.day;
    state.sessions[date] = day;
    if (state.guest) {
      const g = store.get(K.guest) || {};
      g.days = g.days || {}; g.days[date] = day; g.progress = state.progress;
      store.set(K.guest, g);
    } else if (state.key) pending.days[date] = true;
  }
  flush();
}
function saveProgress() {
  if (!state.progress) return;
  if (state.guest) { const g = store.get(K.guest) || {}; g.progress = state.progress; store.set(K.guest, g); }
  else if (state.key) { pending.progress = true; flush(); }
}
async function flush() {
  if (busy || state.guest || !state.key) return;
  const date = Object.keys(pending.days)[0];
  if (!date && !pending.progress) return;
  const my = gen;
  busy = true;
  if (date) delete pending.days[date]; else pending.progress = false;
  try {
    if (date) await sync.saveDay(state.key, date, state.sessions[date]);
    else await sync.saveProgress(state.key, state.progress);
    if (my !== gen) return;   // the account changed while this was in flight
    busy = false; backoff = 0; flush();
  } catch (e) {
    if (my !== gen) return;

/* ---------- Game loop: one rAF loop per game screen counts foreground time and drives timed displays ---------- */
const game = { mode: null, raf: 0, last: 0, frameMs: 1000 / 60, onFrame: null, shownS: -1, queue: null, met: null, active: 0 };
const IDLE_MS = 20000, WAITS = /^(ask|ask2|meet)$/;   // a screen that waits for the player pauses the clock after 20 s idle
let cur = null, fbTimer = 0;
function loopStart() { if (!game.raf && game.mode) { game.last = 0; game.active = performance.now(); game.raf = requestAnimationFrame(tick); } }
function loopStop() { cancelAnimationFrame(game.raf); game.raf = 0; }
function tick(ts) {
  if (today() !== state.date) return goHome();   // a new day: save the old one, never add play to it
  game.raf = requestAnimationFrame(tick);
  if (!cur || !WAITS.test(cur.phase)) game.active = ts;   // timed displays and feedback count as play
  if (game.last) {
    const d = ts - game.last;
    if (d > 4 && d < 100) game.frameMs = game.frameMs * 0.9 + d * 0.1;   // measured frame interval
    if (ts - game.active < IDLE_MS) { state.day = Session.addTime(state.day, game.mode, d, Date.now()); state.dirty = true; }
  }
  game.last = ts;
  if (game.onFrame) game.onFrame(ts);
  updateClock();
}
// Keep what was painted at frame time t0 until ms have passed (to the nearest frame), then run fn(ts).
// Timestamps, not frame counts, so a 120 Hz screen shows the same time as a 60 Hz one.
function hold(t0, ms, fn) {
  game.onFrame = (ts) => { if (ts - t0 >= ms - game.frameMs / 2) { game.onFrame = null; fn(ts); } };
}
function stopGame() {
  loopStop(); clearTimeout(fbTimer);
  game.mode = null; game.onFrame = null; cur = null;
}
document.addEventListener("visibilitychange", () => {
  if (!game.mode) return;
  if (document.visibilityState === "hidden") {
    loopStop();
    // A timed display seen only in part is not fair: drop it and start a new round on return.
    if (cur && /setup|show|mask|walk/.test(cur.phase)) { game.onFrame = null; cur = null; clearStage(); }
    saveNow(); saveProgress();
  } else {
    if (today() !== state.date) return goHome();
    loopStart();
    if (!cur) ROUND[game.mode]();
  }
});
["pointerdown", "keydown"].forEach((ev) => addEventListener(ev, () => { game.active = performance.now(); }, true));
addEventListener("pagehide", () => { if (game.mode) { saveNow(); saveProgress(); } else saveNow(); });

function updateClock() {
  if (!game.mode) return;
  const s = state.day.modes[game.mode];
  if (s === game.shownS) return;
  game.shownS = s;
  const goal = PARTS[game.mode][1], bar = $("gbar"), left = $("gleft");
  if (bar) bar.style.width = Math.min(100, 100 * s / goal).toFixed(1) + "%";
  if (left) left.textContent = t("minLeft", { m: Math.max(0, Math.ceil((goal - s) / 60)) });
}
function stageHTML(mode) {
  let rug = "";
  if (mode === "peek") {
    rug = `<canvas class="mask" id="mask" width="96" height="40"></canvas><img class="it center" id="pc" alt="">` +
      POS.map((q, p) => `<img class="it edge" id="s${p}" alt="" style="left:${q.x.toFixed(1)}%;top:${q.y.toFixed(1)}%">`).join("") +
      POS.map((q, p) => `<button class="pos" data-act="pos" data-p="${p}" aria-label="${esc(t("posN", { n: p + 1 }))}" hidden style="left:${q.x.toFixed(1)}%;top:${q.y.toFixed(1)}%"></button>`).join("");
  } else if (mode === "parade") rug = `<img class="it walker" id="walker" alt="">`;
  else rug = `<img class="it center" id="pc" alt="">`;
  return `<div class="stage-wrap">
    <div class="ghead"><button class="btn small ghost" data-act="home">${esc(t("home"))}</button>
      <div class="gprog"><span class="gname">${esc(t(PARTS[mode][0]))}</span><span class="gleft" id="gleft"></span><div class="bar"><i id="gbar"></i></div></div></div>
    <div class="stage"><div class="ask" id="ask" hidden></div>

}
function startPart() {

  const part = Session.nextPart(state.day, namesOn(), namesQueue(state.date).length);
  if (part === "done") return showDone();
  game.mode = part; game.shownS = -1; cur = null;
  game.queue = part === "names" ? namesQueue(state.date) : null; game.met = {};
  render(stageHTML(part));
  updateClock(); loopStart(); ROUND[part]();
}
function endPart() { saveNow(); saveProgress(); showDone(); }
function goHome() { if (game.mode) { saveNow(); saveProgress(); } showHome(); }
function partOver() {
  if (game.mode === "names" && !game.queue.length) return true;
  return state.day.modes[game.mode] >= PARTS[game.mode][1];
}
function showAsk(html) { const a = $("ask"); a.innerHTML = html; a.hidden = false; }

  document.querySelectorAll(".pos").forEach((b) => { b.hidden = true; });
  hideAsk();
}
const decoded = (imgs) => Promise.all(imgs.map((i) => (i.decode ? i.decode().catch(() => {}) : 0)));
const charBtn = (id) => { const m = member(id); return `<button class="cbtn" data-act="pick" data-id="${m.id}" aria-label="${esc(m.name)}"><img src="${m.img}" alt=""><span>${esc(m.name)}</span></button>`; };
function feedback(ok) {
  cur.phase = "fb"; hideAsk(); saveSoon();
  const fb = $("fb");
  fb.src = ok ? Cast.ART.cheer : Cast.ART.oops; fb.hidden = false;
  fb.classList.remove("pop"); void fb.offsetWidth; fb.classList.add("pop");
  $("live").textContent = t(ok ? "right" : "wrong");
  fbTimer = setTimeout(() => { fb.hidden = true; if (partOver()) endPart(); else ROUND[game.mode](); }, 600);
}

/* Peek-a-boo: show for ms, mask 250 ms, then ask. */
function drawMask() {
  const c = $("mask"), x = c.getContext("2d"), img = x.createImageData(c.width, c.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = 120 + Math.random() * 135;
    d[i] = v + Math.random() * 40; d[i + 1] = v * (0.75 + Math.random() * 0.25); d[i + 2] = v + Math.random() * 30; d[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
}
function peekRound() {
  const st = state.progress.peek, tr = Peek.makeTrial(st, Math.random, CAST_IDS), target = pick(Cast.TARGETS);
  const me = cur = { tr, target, ans: {}, phase: "setup" };
  clearStage();
  const pc = $("pc"), shown = [pc];
  pc.src = member(tr.center).img;
  POS.forEach((q, p) => {
    const s = $("s" + p);
    if (p === tr.edge) s.src = target.img;
    else if (tr.distractors.indexOf(p) >= 0) s.src = pick(Cast.DISTRACTORS).img;
    else return;
    shown.push(s);
  });
  decoded(shown).then(() => {
    if (cur !== me) return;
    game.onFrame = (t0) => {
      game.onFrame = null; me.phase = "show";
      shown.forEach((el) => el.classList.add("on"));
      hold(t0, st.ms, (t1) => {
        shown.forEach((el) => el.classList.remove("on"));
        drawMask(); $("mask").classList.add("on"); me.phase = "mask";
        hold(t1, 250, () => { $("mask").classList.remove("on"); me.phase = "ask"; askCenter(); });
      });
    };
  });
}
function askCenter() {
  showAsk(`<p class="q">${esc(t("peekQ1"))}</p><div class="choices">${cur.tr.choices.map(charBtn).join("")}</div>`);
}
function askEdge() {
  cur.phase = "ask2";
  showAsk(`<p class="q"><span>${esc(t("peekQ2", { thing: t("thing_" + cur.target.id) }))}</span><img class="qimg" src="${cur.target.img}" alt=""></p>`);
  document.querySelectorAll(".pos").forEach((b) => { b.hidden = false; });
}
function peekAnswer(key, v) {
  if (key === "center" && cur.phase !== "ask") return;
  if (key === "edge" && cur.phase !== "ask2") return;
  cur.ans[key] = v;
  if (key === "center" && state.progress.peek.level >= 2) return askEdge();
  document.querySelectorAll(".pos").forEach((b) => { b.hidden = true; });
  const r = Peek.grade(state.progress.peek, cur.tr, cur.ans);
  state.progress.peek = r.state;
  feedback(r.ok);
}

/* Toy parade: each character walks across for 1 s, then the player taps them in order. */
function paradeRound() {
  const r = Parade.makeSequence(state.progress.parade, Math.random, CAST_IDS);
  const me = cur = { r, ans: [], phase: "setup" };
  clearStage();
  const w = $("walker");
  let i = 0;
  const step = (ts) => {
    if (i >= r.seq.length) { w.classList.remove("on", "go"); me.phase = "ask"; askParade(); return; }
    w.src = member(r.seq[i]).img; w.alt = member(r.seq[i]).name;
    w.classList.remove("go"); void w.offsetWidth; w.classList.add("on", "go");
    i++;
    hold(ts, 1000, step);
  };
  const imgs = CAST_IDS.map((id) => { const x = new Image(); x.src = member(id).img; return x; });
  decoded(imgs).then(() => {
    if (cur !== me) return;
    game.onFrame = (ts) => { game.onFrame = null; me.phase = "walk"; step(ts); };
  });
}
function askParade() {
  showAsk(`<p class="q">${esc(t(cur.r.reverse ? "paradeQRev" : "paradeQ"))}</p><div class="slots" id="slots"></div>
    <div class="choices">${CAST_IDS.map(charBtn).join("")}</div>
    <button class="btn small link" data-act="undo">${esc(t("undo"))}</button>`);
  renderSlots();
}
function renderSlots() {
  $("slots").innerHTML = cur.r.seq.map((x, i) => {
    const id = cur.ans[i];
    return id ? `<span class="f"><img src="${member(id).img}" alt="${esc(member(id).name)}"></span>` : `<span></span>`;
  }).join("");
}
function paradeTap(id) {
  if (cur.phase !== "ask") return;
  cur.ans.push(id); renderSlots();
  if (cur.ans.length < cur.r.seq.length) return;
  const g = Parade.grade(state.progress.parade, cur.r, cur.ans);
  state.progress.parade = g.state;
  feedback(g.ok);
}

/* Name that friend: Leitner cards; a wrong card comes back at the end of the session. */
function namesRound() {
  const id = game.queue.shift();
  if (!id) return endPart();
  cur = { id, phase: "ask" };
  clearStage();
  const pc = $("pc"); pc.src = member(id).img; pc.classList.add("on");
  const isNew = !Object.prototype.hasOwnProperty.call(state.progress.names, id);
  if (isNew && !game.met[id]) {
    game.met[id] = true; cur.phase = "meet";
    return showAsk(`<p class="q">${esc(t("meet", { name: member(id).name }))}</p><button class="btn primary" data-act="met">${esc(t("gotIt"))}</button>`);
  }
  askName();
}
function askName() {
  cur.phase = "ask";
  showAsk(`<p class="q">${esc(t("namesQ"))}</p><div class="names">${Names.choices(cur.id, CAST_IDS, Math.random)
    .map((x) => `<button class="btn ghost" data-act="name" data-id="${x}">${esc(member(x).name)}</button>`).join("")}</div>`);
}

  state.progress.names = Names.grade(state.progress.names, cur.id, ok, state.date);

const ROUND = { peek: peekRound, parade: paradeRound, names: namesRound };

/* ---------- Events ---------- */
app.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const v = b.dataset.v;
  switch (b.dataset.act) {
    case "lang": state.lang = v; store.set(K.lang, v); if (redraw) redraw(); break;
    case "tracker": sync.useTrackerSession(); store.set(K.profile, null); enterAccount(true); break;
    case "auth": showAuth(v); break;
    case "welcome": showWelcome(); break;
    case "guest": playGuest(); break;
    case "profile": openProfile(state.profiles[+b.dataset.i], pendingUpload); break;
    case "signout": saveNow(); saveProgress(); resetAccount(); sync.signOut(); Object.assign(state, { key: null, name: "", guest: false, sessions: {}, progress: null }); showWelcome(); break;
    case "retry": if (failRetry) failRetry(); break;
    case "play": startPart(); break;
    case "home": goHome(); break;
    case "pick": if (game.mode === "peek") peekAnswer("center", b.dataset.id); else if (game.mode === "parade") paradeTap(b.dataset.id); break;
    case "pos": peekAnswer("edge", +b.dataset.p); break;
    case "undo": if (cur && cur.phase === "ask" && cur.ans.length) { cur.ans.pop(); renderSlots(); } break;
    case "met": askName(); break;
    case "name": nameAnswer(b.dataset.id); break;
  }
});
app.addEventListener("submit", (e) => { e.preventDefault(); if (e.target.id === "authForm") submitAuth(e.target); });

if (sync.session()) enterAccount(false); else showWelcome();
</script>
</body>
</html>
